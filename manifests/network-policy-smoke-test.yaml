apiVersion: apps/v1
kind: Deployment
metadata:
  name: netpol-backend
  namespace: apps
  labels:
    app.kubernetes.io/name: netpol-backend
    app.kubernetes.io/part-of: shopease
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: netpol-backend
      app.kubernetes.io/part-of: shopease
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netpol-backend
        app.kubernetes.io/part-of: shopease
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: netpol-backend
  namespace: apps
spec:
  selector:
    app.kubernetes.io/name: netpol-backend
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netpol-database
  namespace: apps
  labels:
    app.kubernetes.io/name: netpol-database
    app.kubernetes.io/part-of: shopease
    app.kubernetes.io/component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: netpol-database
      app.kubernetes.io/part-of: shopease
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netpol-database
        app.kubernetes.io/part-of: shopease
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: netpol-database
  namespace: apps
spec:
  selector:
    app.kubernetes.io/name: netpol-database
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Pod
metadata:
  name: netpol-frontend-client
  namespace: apps
  labels:
    app.kubernetes.io/name: netpol-frontend-client
    app.kubernetes.io/part-of: shopease
    app.kubernetes.io/component: frontend
spec:
  containers:
    - name: client
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - sleep 3600
---
apiVersion: v1
kind: Pod
metadata:
  name: netpol-backend-client
  namespace: apps
  labels:
    app.kubernetes.io/name: netpol-backend-client
    app.kubernetes.io/part-of: shopease
    app.kubernetes.io/component: backend
spec:
  containers:
    - name: client
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - sleep 3600
---
apiVersion: v1
kind: Pod
metadata:
  name: netpol-blocked-client
  namespace: apps
  labels:
    app.kubernetes.io/name: netpol-blocked-client
    app.kubernetes.io/part-of: shopease
    app.kubernetes.io/component: blocked
spec:
  containers:
    - name: client
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - sleep 3600

apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyverno-bad-missing-labels
  namespace: sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kyverno-bad-missing-labels
  template:
    metadata:
      labels:
        app: kyverno-bad-missing-labels
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi

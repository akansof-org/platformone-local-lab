apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyverno-bad-no-resources
  namespace: sandbox
  labels:
    app.kubernetes.io/name: kyverno-bad-no-resources
    app.kubernetes.io/part-of: policy-smoke
    platformone.io/owner: platform-engineering
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kyverno-bad-no-resources
      app.kubernetes.io/part-of: policy-smoke
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kyverno-bad-no-resources
        app.kubernetes.io/part-of: policy-smoke
        platformone.io/owner: platform-engineering
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80

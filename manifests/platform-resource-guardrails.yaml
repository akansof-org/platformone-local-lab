apiVersion: v1
kind: ResourceQuota
metadata:
  name: platformone-system-quota
  namespace: platformone-system
  labels:
    platformone.io/managed-by: platformone-local-lab
    platformone.io/guardrail-type: resource-quota
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "20"
    persistentvolumeclaims: "5"
    requests.storage: 10Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: platformone-system-defaults
  namespace: platformone-system
  labels:
    platformone.io/managed-by: platformone-local-lab
    platformone.io/guardrail-type: limit-range
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
      min:
        cpu: 25m
        memory: 64Mi
      max:
        cpu: "1"
        memory: 1Gi
    - type: PersistentVolumeClaim
      min:
        storage: 128Mi
      max:
        storage: 5Gi
---

apiVersion: v1
kind: LimitRange
metadata:
  name: platformone-system-defaults
  namespace: platformone-system
  labels:
    platformone.io/managed-by: platformone-local-lab
    platformone.io/guardrail-type: limit-range
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
      min:
        cpu: 25m
        memory: 64Mi
      max:
        cpu: "1"
        memory: 1Gi
    - type: PersistentVolumeClaim
      min:
        storage: 128Mi
      max:
        storage: 5Gi
---

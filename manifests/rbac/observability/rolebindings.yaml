apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: observability-sre-admin
  namespace: observability
  labels:
    platformone.io/managed-by: platformone-local-lab
    platformone.io/rbac-binding: namespace-owner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platformone-namespace-admin
subjects:
  - kind: Group
    name: platformone:sre
    apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: observability-platform-engineering-viewer
  namespace: observability
  labels:
    platformone.io/managed-by: platformone-local-lab
    platformone.io/rbac-binding: platform-visibility
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platformone-namespace-viewer
subjects:
  - kind: Group
    name: platformone:platform-engineering
    apiGroup: rbac.authorization.k8s.io

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: apps-admin
  namespace: apps
  labels:
    platformone.io/managed-by: platformone-local-lab
    platformone.io/rbac-binding: namespace-owner
subjects:
  - kind: Group
    name: platformone:product-engineering
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platformone-namespace-admin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: apps-platform-engineering-viewer
  namespace: apps
  labels:
    platformone.io/managed-by: platformone-local-lab
    platformone.io/rbac-binding: platform-visibility
subjects:
  - kind: Group
    name: platformone:platform-engineering
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platformone-namespace-viewer
